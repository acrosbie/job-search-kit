# Field pack: customer support, support operations and CX technology, at manager level and up,
# plus the adjacent systems, knowledge, contact center and escalation roles. Every pattern was tuned
# against tens of thousands of real titles in September 2026. "Principal", "Staff" and a bare
# "Support Operations" title were added in October 2026: on one real scan's 58,992 titles they kept 5
# more and lost none. The last eight search phrases found 3 of one day's 4 new jobs.
#
# roles_field: the words that put a product, program or owner title in this field. A user who takes
# such roles without managing anyone gets titles.roles from the role_shapes they accept (setup, or the
# tune skill), and a title then passes with one of those and one of these, and no exclusion. On one
# real scan, product, program, systems-owner and strategy-and-operations shapes kept 28 more titles and
# lost none, with "agent" no longer excluding Sierra's and Decagon's agent development roles.

[titles]
function = "customer support|technical support|product support|premier support|support (operations|ops|systems|technology|tools|platform|engineering|experience|delivery|strategy|program|vendor)|head of [\\w &]*support|\\bescalations?\\b|cx (operations|ops|systems|technology|strategy|data|insights|analytics)|cx \\w+ (systems|strategy|operations|technology|data|insights|analytics)|cx manager|customer (operations|experience)|customer (care|service)\\b|user (operations|ops)|community support|\\bknowledge (management|manager|program|systems|architect|base|lead|and enablement|& enablement)\\b|cx knowledge|support knowledge|self[- ]service (ai|experience|operations|strategy|support)|\\bitsm\\b|it service (management|desk)|service desk (operations|&|and)|enterprise service management|\\bwfm\\b|workforce management|contact cent(er|re)|call cent(er|re)"
level = "\\bmanager\\b|senior manager|sr\\.? manager|\\bmgr\\b|\\bhead\\b|\\bdirector\\b|\\blead\\b|\\badministrator\\b|\\barchitect\\b|\\bplanner\\b|\\bprincipal\\b|\\bstaff\\b|^support operations\\b"
exclude = "associate(?! director)|team lead|specialist|representative|\\bagent\\b(?! (development|product manager))|analyst|intern\\b|vice president|\\bvp\\b|customer success manager|account manager|\\bsales\\b|solutions? (architect|engineer|consultant)|^(?![^|]*\\b(manager|director|head)\\b)[^|]*engineer\\b(?!ing manager)|(?<!support )engineering manager|forward deployed|technician|helpdesk|help desk|\\bit support\\b|desktop support|marketing|demand generation|\\bdesign\\b|security|\\bux\\b|content|localization"
field_words = "\\bsupport\\b|customer|\\bcx\\b|service desk|help ?desk|contact cent|call cent|escalation|knowledge|\\bcare\\b"
roles_field = "\\bsupport\\b|customer (support|service|experience|care|operations|engagement)|\\bcustomers\\b|\\bcx\\b|service desk|help ?desk|contact cent|call cent|knowledge (management|base|program)|self[- ]service|conversational|chatbot|virtual (agent|assistant)|agent assist|\\bagent (development|product manager)\\b|\\bitsm\\b|it service management|enterprise service management|workforce management|\\bwfm\\b|voice of the customer|\\bvoc\\b"

[[phrase_rejects]]
name = "quota and renewals"
phrases = "book of business|renewal|upsell|quota|expansion revenue|net revenue retention|\\bnrr\\b"
min_distinct = 2
same_as = { "net revenue retention" = "nrr" }
reason = "Not a fit: this reads as an account-management job carrying renewals or a quota ({hits})."

# The roles a user may take without managing anyone, each as a title pattern; setup joins the ones they accept
# into titles.roles.
[role_shapes]
"product manager" = "product manager|product owner"
"program manager" = "program manager|programme manager"
"systems owner" = "\\bsystems? owner\\b|platform owner|service owner"
"strategy and operations" = "strategy (and|&) operations|strategy & ops\\b"

[aggregator]
queries = ["support operations", "customer support", "technical support", "customer experience operations", "cx operations", "support systems", "knowledge management", "escalation manager", "contact center", "workforce management", "customer care", "head of support", "support technology", "cx systems", "customer experience technology", "ai agent", "conversational ai", "service desk", "self-service", "support enablement"]
