<title>__PAGE_TITLE__</title>
<style>
/* Layout: one column, urgent first. A header and a bar of counts; then a closed tray of the user's
   choices waiting for Claude (only when there are some), Today (the next interview, what to do now, how the search is going), what's
   due, the jobs worth a look as full cards, the applications with their 21-day clock, the new jobs
   as compact rows, and what was screened out, folded away.
   Status labels are stamps in the stamp-pad blue of an application form. */
:root {
  --bg: #f3f5f8;
  --surface: #ffffff;
  --sunken: #eaeef3;
  --ink: #15202b;
  --muted: #5b6875;
  --faint: #8a96a3;
  --line: #dbe1e8;
  --accent: #2b4ea2;
  --accent-ink: #ffffff;
  --accent-soft: #e4eaf7;
  --good: #1c7449;
  --good-soft: #e1f2e8;
  --warn: #8c5300;
  --warn-soft: #fbf0db;
  --bad: #a23b31;
  --bad-soft: #f8e3e0;
  --shadow: 0 1px 2px rgb(21 32 43 / 0.06), 0 2px 8px rgb(21 32 43 / 0.04);
  /* The system's own fonts: the page asks nothing of any other site. */
  --display: "Segoe UI Variable Display", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --body: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f151c; --surface: #172029; --sunken: #121a22; --ink: #e6ecf1; --muted: #9aa7b3; --faint: #6f7c88;
    --line: #2a3542; --accent: #94acf0; --accent-ink: #0f151c; --accent-soft: #1d2944; --good: #6fc79c;
    --good-soft: #14301f; --warn: #e7b660; --warn-soft: #33270f; --bad: #ef9087; --bad-soft: #3a1a17;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f151c; --surface: #172029; --sunken: #121a22; --ink: #e6ecf1; --muted: #9aa7b3; --faint: #6f7c88;
  --line: #2a3542; --accent: #94acf0; --accent-ink: #0f151c; --accent-soft: #1d2944; --good: #6fc79c;
  --good-soft: #14301f; --warn: #e7b660; --warn-soft: #33270f; --bad: #ef9087; --bad-soft: #3a1a17;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; padding-inline: 16px; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); }
.page { max-width: 54rem; margin: 0 auto; padding-block: 24px 72px; display: grid; gap: 28px; min-width: 0; }
h1, h2 { font-family: var(--display); text-wrap: balance; margin: 0; }
h1 { font-size: clamp(1.6rem, 3.6vw, 2.15rem); line-height: 1.1; letter-spacing: -0.015em; }
h2 { font-size: 1.15rem; line-height: 1.25; display: flex; align-items: baseline; gap: 8px; }
h3 { margin: 0; font-size: 1.02rem; line-height: 1.35; font-weight: 600; text-wrap: balance; }
p { margin: 0; }
a { color: var(--accent); text-underline-offset: 2px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
.muted { color: var(--muted); }
.num { font: 500 0.78rem/1 var(--mono); color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.pay { font-variant-numeric: tabular-nums; white-space: nowrap; }
.count { font: 500 0.8rem var(--mono); color: var(--muted); }

/* ------------------------------------------------ header and the bar of counts */
.top { display: grid; gap: 6px; }
.updated { color: var(--muted); font-size: 0.9rem; }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; font-size: 0.9rem; color: var(--muted); }
.status:empty { display: none; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 0.85rem; font-weight: 600; }
.chip.review { background: var(--good-soft); color: var(--good); }
.chip.local, .chip.warn { background: var(--warn-soft); color: var(--warn); }
.jump { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; gap: 6px; overflow-x: auto;
  scrollbar-width: none; padding-block: 10px; background: var(--bg); border-bottom: 1px solid var(--line); }
.jump::-webkit-scrollbar { display: none; }
.jump button { flex: none; display: inline-flex; align-items: baseline; gap: 7px; padding: 6px 12px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 0.88rem; min-height: 34px; }
.jump button b { font: 600 0.84rem var(--mono); font-variant-numeric: tabular-nums; }
.jump button.hot { border-color: var(--accent); }
.jump button.hot b { color: var(--accent); }
.jump button.zero { color: var(--faint); }

/* ------------------------------------------------ sections */
/* The page keeps what the user is looking at in place itself when it redraws (keepPlace), so the
   browser's own scroll anchoring stays out of it. */
.sections { display: grid; gap: 34px; min-width: 0; overflow-anchor: none; }
section { display: grid; gap: 12px; min-width: 0; scroll-margin-top: 64px; }
.section-head { display: grid; gap: 4px; }
.lede { color: var(--muted); font-size: 0.92rem; max-width: 64ch; }
.empty { padding: 14px 16px; border: 1px dashed var(--line); border-radius: 8px; color: var(--muted); font-size: 0.92rem; }
.stack { display: grid; gap: 12px; }

/* stamps: a job's verdict, an application's status, what's due */
.stamp { display: inline-block; font: 600 0.68rem/1 var(--body); letter-spacing: 0.08em; text-transform: uppercase;
  padding: 4px 7px 3px; border: 1.5px solid currentColor; border-radius: 3px; white-space: nowrap; }
.s-worth, .s-offer, .s-interview, .s-screen, .s-replied, .s-send { color: var(--good); background: var(--good-soft); }
.s-call, .s-new, .s-applied { color: var(--accent); background: var(--accent-soft); }
.s-closing, .s-find { color: var(--warn); background: var(--warn-soft); }
.s-out, .s-rejected, .s-presumed, .s-withdrawn, .s-closed { color: var(--muted); background: transparent; }

/* ------------------------------------------------ jobs worth a look: full cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow);
  padding: 16px 18px; display: grid; gap: 10px; min-width: 0; }
.card-top { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; }
.card-top .pay { margin-left: auto; font-weight: 600; }
.where { color: var(--muted); font-size: 0.92rem; overflow-wrap: anywhere; }
.where b { color: var(--ink); font-weight: 600; }
.why { border-radius: 8px; padding: 10px 12px; font-size: 0.93rem; max-width: 68ch; overflow-wrap: anywhere; display: grid; gap: 2px; }
.why .k { font-size: 0.74rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; }
.why.question { background: var(--accent-soft); }
.why.question .k { color: var(--accent); }
.why.tip { background: var(--good-soft); }
.why.tip .k { color: var(--good); }
.why.said { background: var(--sunken); }
.why.said .k { color: var(--muted); }
.why.plain { background: var(--sunken); }
.flag { font-size: 0.88rem; color: var(--warn); }

/* buttons */
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 6px 14px;
  min-height: 38px; font-weight: 500; }
button:hover { border-color: var(--accent); }
button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
button.quiet { border-color: transparent; background: transparent; color: var(--muted); }
button.quiet:hover { color: var(--ink); background: var(--sunken); }
button.mini { min-height: 32px; padding: 4px 11px; font-size: 0.86rem; }
button.link { border: 0; background: none; padding: 0; min-height: 0; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; font-weight: 500; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible, summary:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px; }
.actions { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }

/* the form a choice opens */
.panel { display: grid; gap: 10px; padding: 12px; border-radius: 8px; background: var(--sunken); border: 1px solid var(--line); min-width: 0; }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(12.5rem, 1fr)); gap: 10px; }
label { display: grid; gap: 4px; font-size: 0.86rem; color: var(--muted); }
select, input, textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; min-width: 0; width: 100%; }
.choices-menu { display: flex; flex-wrap: wrap; gap: 6px; }

/* ------------------------------------------------ compact rows: new jobs, screened out */
.rows { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
.row { display: grid; grid-template-columns: 3rem minmax(0, 1fr) auto; gap: 2px 12px; align-items: center; padding: 10px 14px;
  border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row .num { align-self: start; padding-top: 4px; }
.row-main { display: grid; gap: 1px; min-width: 0; }
.row-title { font-weight: 600; overflow-wrap: anywhere; }
.row-meta { color: var(--muted); font-size: 0.87rem; overflow-wrap: anywhere; }
.row-note { font-size: 0.87rem; color: var(--muted); overflow-wrap: anywhere; }
.row-note.flag { color: var(--warn); }
.row .actions { flex-wrap: nowrap; }
.row .panel { grid-column: 2 / -1; margin-top: 8px; }
.filter { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.filter input { max-width: 22rem; }
.filter .count { font-size: 0.82rem; }

/* ------------------------------------------------ to do and applications: the 21-day clock */
.todo { border-color: var(--warn); }
.soon { border-color: var(--accent); }
.clock { display: grid; gap: 4px; max-width: 26rem; }
.clock-bar { height: 6px; border-radius: 3px; background: var(--sunken); overflow: hidden; }
.clock-bar span { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.clock.late .clock-bar span { background: var(--warn); }
.clock-label { font-size: 0.82rem; color: var(--muted); font-variant-numeric: tabular-nums; }
.apps { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); }
.app { display: grid; grid-template-columns: 3rem minmax(0, 1fr) auto; gap: 6px 12px; padding: 14px 16px; border-top: 1px solid var(--line); }
.app:first-child { border-top: 0; }
.app .num { padding-top: 4px; }
.app-main { display: grid; gap: 4px; min-width: 0; }
.app-name { overflow-wrap: anywhere; }
.app-name b { font-weight: 600; }
.app-meta { color: var(--muted); font-size: 0.87rem; }
.app-side { display: grid; justify-items: end; align-content: start; gap: 8px; }
.app .more { grid-column: 2 / -1; display: grid; gap: 8px; min-width: 0; }
.said-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 7px 10px; border-radius: 6px;
  background: var(--accent-soft); font-size: 0.88rem; }

/* ------------------------------------------------ today: what to do now, and how the search is going */
.focus { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
  padding: 16px 18px; display: grid; gap: 14px; min-width: 0; }
.focus-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(15rem, 1fr)); gap: 14px 24px; }
.focus-block { display: grid; gap: 6px; align-content: start; min-width: 0; }
.k, .part .k { font-size: 0.74rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.focus-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.focus-list li { overflow-wrap: anywhere; }
.focus .sub { display: block; color: var(--muted); font-size: 0.88rem; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(5.5rem, 1fr)); gap: 10px 12px;
  border-top: 1px solid var(--line); padding-top: 12px; }
.tile { display: grid; gap: 2px; align-content: start; min-width: 0; }
.tile .label { font-size: 0.8rem; color: var(--muted); }
.tile .value { font: 600 1.35rem/1.15 var(--display); }
.tile .value small { font: 400 0.8rem var(--body); color: var(--muted); }
.tile.wide { grid-column: span 2; }
.spark { display: flex; align-items: flex-end; gap: 2px; height: 28px; margin-top: 4px; }
.spark span { flex: 1 1 0; max-width: 14px; min-height: 2px; background: var(--faint); border-radius: 3px 3px 0 0; }
.spark span.now { background: var(--accent); }

/* ------------------------------------------------ a job's summary, and Claude's working notes folded away */
.headline { font-weight: 600; max-width: 68ch; }
.parts { display: grid; gap: 8px; max-width: 68ch; }
.part { display: grid; gap: 2px; font-size: 0.93rem; overflow-wrap: anywhere; }
.part ul { margin: 0; padding-left: 1.1rem; display: grid; gap: 2px; }
.part.ask { background: var(--accent-soft); border-radius: 8px; padding: 8px 10px; }
.part.ask .k { color: var(--accent); }
.part.tip .k { color: var(--good); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 2px; }
.chip.word { background: var(--sunken); color: var(--ink); font-weight: 500; border: 1px solid var(--line); }
details.behind { font-size: 0.87rem; color: var(--muted); }
details.behind > summary { cursor: pointer; width: fit-content; }
details.behind .behind-body { display: grid; gap: 4px; padding-top: 6px; overflow-wrap: anywhere; max-width: 68ch; }

/* ------------------------------------------------ applications: which, in what order; people to find */
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; border-radius: 0; min-height: 36px; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.controls input { max-width: 16rem; }
.controls label { display: inline-flex; align-items: center; gap: 6px; font-size: 0.88rem; }
.controls select { width: auto; }
.people { list-style: none; margin: 0; padding: 0; }
.people li { display: grid; grid-template-columns: 3rem minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 10px 0;
  border-top: 1px solid var(--line); }
.people li:first-child { border-top: 0; }
.people .num { align-self: start; padding-top: 4px; }
.people .panel, .people .said-line { grid-column: 2 / -1; }
a.btn { display: inline-flex; align-items: center; min-height: 32px; padding: 4px 11px; border: 1px solid var(--line); border-radius: 7px;
  font-size: 0.86rem; font-weight: 500; text-decoration: none; background: var(--surface); }
a.btn:hover { border-color: var(--accent); }

/* ------------------------------------------------ a choice lands where it was made: the job stays put, outlined, its
   buttons give way to the stamp and an Undo, and Your choices is a closed tray of what's waiting for Claude */
.card.chosen { border-color: var(--accent); }
.row.chosen { background: var(--accent-soft); }
.tray { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
.tray > summary { cursor: pointer; padding: 10px 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 10px; font-weight: 600; }
.tray > summary .muted { font-weight: 400; font-size: 0.9rem; }
.tray > summary .error { font-weight: 400; font-size: 0.9rem; }
.tray > summary::after { content: "Show"; margin-left: auto; font-weight: 500; font-size: 0.88rem; color: var(--accent); }
.tray[open] > summary::after { content: "Hide"; }
.tray[open] > summary { border-bottom: 1px solid var(--line); }
.tray .lede { padding: 10px 14px 0; }
.tray .rows { border: 0; border-radius: 0 0 10px 10px; margin-top: 8px; }
.tray > .actions { padding: 0 14px 14px; }
.choice .row-note { color: var(--muted); }
.choice.problem .row-note { color: var(--bad); }
.tray textarea { display: block; margin: 0 14px 14px; width: calc(100% - 28px); min-height: 7rem; font: 0.8rem/1.4 var(--mono); }

details.out { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
details.out > summary { cursor: pointer; padding: 14px 16px; font-family: var(--display); font-weight: 600; font-size: 1.05rem;
  display: flex; align-items: baseline; gap: 8px; }
details.out[open] > summary { border-bottom: 1px solid var(--line); }
details.out .lede { padding: 12px 16px 0; }
details.out .rows { border: 0; border-radius: 0 0 10px 10px; margin-top: 8px; }

.toast { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 50%; transform: translateX(-50%);
  width: min(32rem, calc(100% - 32px)); background: var(--ink); color: var(--bg); border-radius: 10px; padding: 12px 16px;
  box-shadow: 0 8px 28px rgb(0 0 0 / 0.25); z-index: 10; font-size: 0.93rem; }
.sendbar { position: sticky; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); display: flex; flex-wrap: wrap; align-items: center;
  justify-content: space-between; gap: 10px; background: var(--ink); color: var(--bg); border-radius: 10px; padding: 10px 14px;
  box-shadow: 0 8px 28px rgb(0 0 0 / 0.2); }
.sendbar button { background: var(--bg); color: var(--ink); border-color: var(--bg); font-weight: 600; }
.error { color: var(--bad); }

@media (max-width: 36rem) {
  /* Every section's pill in view, on as many rows as it takes, rather than a strip to scroll sideways. */
  .jump { position: static; flex-wrap: wrap; overflow: visible; margin-inline: -16px; padding-inline: 16px; }
  .people li { grid-template-columns: 2.6rem minmax(0, 1fr); }
  .people .actions { grid-column: 2; }
  .focus { padding: 14px; }
  .row, .app { grid-template-columns: 2.6rem minmax(0, 1fr); }
  .row .actions, .app-side { grid-column: 2; justify-items: start; }
  .app-side { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .card { padding: 14px; }
  .card-top .pay { margin-left: 0; width: 100%; }
}
@media (prefers-reduced-motion: no-preference) {
  button { transition: border-color 0.12s, background-color 0.12s, color 0.12s; }
  .toast { animation: drop 0.18s ease-out; }
  @keyframes drop { from { transform: translate(-50%, -8px); opacity: 0.4; } }
}
</style>

<div class="page">
  <header class="top">
    <h1 id="title">Your job search</h1>
    <p class="updated" id="updated">Loading your jobs.</p>
    <p class="status" id="status"></p>
  </header>
  <nav class="jump" id="jump" aria-label="Sections" hidden></nav>
  <main id="app" class="sections"></main>
  <div class="sendbar" id="sendbar" hidden></div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="application/json" id="jobs-data">__JOBS_DATA__</script>
<script>
(function () {
  "use strict";

  var ACTIONS = {
    want: "Want it", skip: "Skip", applied: "I applied", followed_up: "I followed up", replied: "They replied",
    screen: "Screen booked", interview: "Interview", offer: "Offer", rejected: "Turned down", withdrawn: "I withdrew",
    contact: "Add a contact"
  };
  // What a saved choice says, and how its stamp looks.
  var CHOSEN = {
    want: ["You want it", "s-worth"], skip: ["Skipped", "s-out"], applied: ["You applied", "s-applied"],
    followed_up: ["Followed up", "s-call"], replied: ["They replied", "s-replied"], screen: ["Screen booked", "s-screen"],
    interview: ["Interview", "s-interview"], offer: ["Offer", "s-offer"], rejected: ["Turned down", "s-rejected"],
    withdrawn: ["You withdrew", "s-withdrawn"], contact: ["Contact added", "s-call"]
  };
  var VERDICT = {
    worth_applying: ["Worth applying", "s-worth"], your_call: ["Your call", "s-call"], "new": ["New", "s-new"],
    not_a_fit: ["Not a fit", "s-out"]
  };
  var STATUS = {
    applied: ["Applied", "s-applied"], replied: ["Replied", "s-replied"], screen: ["Screen", "s-screen"],
    interview: ["Interview", "s-interview"], offer: ["Offer", "s-offer"], rejected: ["Turned down", "s-rejected"],
    presumed_rejected: ["No reply", "s-presumed"], withdrawn: ["Withdrew", "s-withdrawn"], closed: ["Closed", "s-closed"]
  };
  var ROUTE = { send: ["Follow up", "s-send"], find_person: ["Find a person", "s-find"], close: ["Nothing to send", "s-closing"] };
  var CHANNELS = [["", "Not sure"], ["company_site", "On the company's site"], ["linkedin", "Through LinkedIn"],
                  ["referral", "Through someone I know"], ["other", "Some other way"]];
  var VIA = { company_site: "on their site", linkedin: "through LinkedIn", referral: "through someone you know", other: "another way" };
  var EVENTS = { followed_up: true, contact: true };   // kept alongside a status choice, never replacing one
  var APP_CHOICES = ["replied", "screen", "interview", "offer", "rejected", "withdrawn", "followed_up", "contact"];

  var data = null;
  try { data = JSON.parse(document.getElementById("jobs-data").textContent); } catch (e) { data = null; }
  // Clicks kept in this browser, under one name for this search, so a page rebuilt by the next scan
  // still has the clicks not yet sent to Claude. Clicks Claude has dealt with (data.handled) drop out.
  var PREFIX = "job-search-choices ";
  var LOCAL = PREFIX + (data ? data.title : "");
  var FILTER = "job-search-filter";
  var mode = "file";          // "file": opened from the folder; "saving": an artifact whose clicks save
  var clicks = null;          // the store's collection of clicks, when saving
  var choices = {};           // id -> choice
  var open = null;            // {kind, ref, action} of the form being filled in ("menu": an application's choices)
  var draft = {};             // what has been typed into that form
  var problem = "";
  var toastTimer = null;
  var filter = "";
  try { filter = localStorage.getItem(FILTER) || ""; } catch (e) { filter = ""; }
  // Which applications show, and in what order: remembered in this browser only.
  var APPS_VIEW = "job-search-apps-view", APPS_SORT = "job-search-apps-sort";
  var appsView = "open", appsSort = "recent", appsFind = "";
  try { appsView = localStorage.getItem(APPS_VIEW) || "open"; appsSort = localStorage.getItem(APPS_SORT) || "recent"; } catch (e) { /* defaults */ }
  var OPEN_STATUSES = ["applied", "replied", "screen", "interview", "offer"];
  var FURTHEST = { offer: 0, interview: 1, screen: 2, replied: 3, applied: 4, presumed_rejected: 5, rejected: 6, withdrawn: 7, closed: 8 };
  // A job's summary, part by part: [field, heading, extra class].
  var PARTS = [["fits", "Why it fits you", ""], ["enjoy", "You'd probably enjoy", ""], ["watch", "Watch out for", ""],
               ["ask", "The one question", "ask"], ["tailor", "For your resume", "tip"]];

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function day(iso) {
    if (!iso) return "";
    var d = new Date(String(iso).slice(0, 10) + "T12:00:00");
    return isNaN(d) ? esc(iso) : d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  }
  // A link from a posting is only ever a web address: never javascript: or anything else.
  function href(url) { return /^https?:\/\//i.test(String(url || "")) ? esc(url) : ""; }
  function stamp(pair) { return '<span class="stamp ' + pair[1] + '">' + esc(pair[0]) + "</span>"; }
  // "Tue 13 Oct, 10:00", or "Tue 13 Oct, time not set" for a day with no time yet.
  function whenText(on) {
    var t = new Date(on.length > 10 ? on : on + "T12:00:00");
    if (isNaN(t)) return esc(on);
    return t.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" }) +
      (on.length > 10 ? ", " + t.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }) : ", time not set");
  }
  function dayOf(on) {
    var t = new Date(String(on).slice(0, 10) + "T12:00:00");
    return isNaN(t) ? esc(on) : t.toLocaleDateString(undefined, { weekday: "short", day: "numeric", month: "short" });
  }
  function stampText(iso) {
    var t = new Date(iso);
    return isNaN(t) ? esc(iso) : day(iso) + ", " + t.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
  }
  function scanFailed() { var s = (data.last_scan || {}).status; return s === "blocked" || s === "failed"; }
  // A rule's number is for checking and tuning, not for reading: "Rule 12, applied by the scanner: pay ..."
  // reads "Pay ...", and "Rule 5 (function): ..." reads "Function: ...".
  function plainReason(t) {
    var s = String(t || "").replace(/^\s*rules?\s*\d+\s*(?:\(([^)]*)\))?\s*(?:,\s*applied by the scanner)?\s*[:,]\s*/i,
      function (m, name) { return name ? name + ": " : ""; });
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function newId() { return "c-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7); }
  function plural(n, one, many) { return n + " " + (n === 1 ? one : many); }
  // Days since a date, counted today: a page opened days after it was built still counts right.
  function daysSince(iso, fallback) {
    if (!iso) return fallback;
    var d = new Date(String(iso).slice(0, 10) + "T12:00:00"), now = new Date();
    now.setHours(12, 0, 0, 0);
    return isNaN(d) ? fallback : Math.round((now - d) / 864e5);
  }

  function toast(text) {
    var t = document.getElementById("toast");
    t.textContent = text; t.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.hidden = true; }, 6000);
  }

  // A board's title sometimes carries its places after a bar: "Controller | United States | Remote".
  function cleanTitle(j) {
    var parts = String(j.title || "").split(/\s+\|\s+/);
    var place = j.location || "";
    var extra = parts.slice(1).filter(function (p) { return place.toLowerCase().indexOf(p.toLowerCase()) < 0; });
    return { title: parts[0], place: [place].concat(extra).filter(Boolean).join(" · ") };
  }

  // ---------------------------------------------------------------- the user's choices

  function all() { return Object.keys(choices).map(function (id) { return choices[id]; }); }
  function handledAs(c) { var h = data && data.handled && data.handled[c.id]; return h ? h.outcome : ""; }
  function problemOf(c) {
    if (c.problem) return c.problem;
    return handledAs(c) === "unknown" ? (data.handled[c.id].why || "Claude couldn't match it to a job") : "";
  }
  function pending() {
    return all().filter(function (c) { return !c.recorded && !handledAs(c); })
      .sort(function (a, b) { return a.at < b.at ? -1 : 1; });
  }
  function problems() {  // shown for a week after Claude tried
    var since = new Date(Date.now() - 7 * 864e5).toISOString().slice(0, 10);
    return all().filter(function (c) {
      return problemOf(c) && (c.recorded ? String(c.recorded) >= since : handledAs(c) === "unknown");
    });
  }
  // The choice still waiting for Claude on this job or application, if any (its latest status choice).
  function waitingOn(field, value, events) {
    var best = null;
    pending().forEach(function (c) {
      if (c[field] === value && (events || !EVENTS[c.action]) && (!best || c.at > best.at)) best = c;
    });
    return best;
  }

  // ---------------------------------------------------------------- pieces

  function button(action, kind, ref, cls, label, num) {
    return '<button type="button" class="' + (cls || "") + '" data-open="' + action + '" data-kind="' + kind + '" data-ref="' + esc(ref) + '"' +
      (num ? ' aria-label="' + esc((label || ACTIONS[action]) + ", #" + num) + '"' : "") + ">" + esc(label || ACTIONS[action]) + "</button>";
  }

  function panel(kind, ref, action) {
    if (!open || open.kind !== kind || open.ref !== ref || open.action !== action) return "";
    var f = [];
    if (action === "applied") {
      f.push('<label for="f-channel">How did you apply?<select id="f-channel" data-field="channel">' +
        CHANNELS.map(function (c) { return '<option value="' + c[0] + '"' + (draft.channel === c[0] ? " selected" : "") + ">" + c[1] + "</option>"; }).join("") +
        "</select></label>");
      f.push('<label for="f-top">One of your top picks?<select id="f-top" data-field="top_pick">' +
        [["", "Not sure"], ["yes", "Yes"], ["no", "No"]].map(function (c) { return '<option value="' + c[0] + '"' + (draft.top_pick === c[0] ? " selected" : "") + ">" + c[1] + "</option>"; }).join("") +
        "</select></label>");
    }
    if (kind === "app") {
      f.push('<label for="f-contact">' + (action === "contact" ? "Their name" : "A person there (optional)") +
        '<input id="f-contact" data-field="contact" maxlength="80" placeholder="Their name" value="' + esc(draft.contact || "") + '"></label>');
    }
    var hint = action === "skip" ? "Why? (optional, it helps tune your rules)" : "Anything to add? (optional)";
    f.push('<label for="f-note">' + hint + '<input id="f-note" data-field="note" maxlength="300" value="' + esc(draft.note || "") + '"></label>');
    return '<div class="panel"><div class="fields">' + f.join("") + '</div><div class="actions">' +
      '<button type="button" class="primary" data-save>Save: ' + esc(ACTIONS[action]) + '</button>' +
      '<button type="button" class="quiet" data-cancel>Cancel</button></div></div>';
  }

  // An application can show in To do and in Applications: its form opens only where it was asked for.
  function opened(section) { return !!open && open.from === section; }

  function chosenDetail(c) {
    var bits = [];
    if (c.channel) bits.push(VIA[c.channel] || c.channel);
    if (c.top_pick) bits.push(c.top_pick === "yes" ? "a top pick" : "not a top pick");
    if (c.contact) bits.push("contact: " + c.contact);
    if (c.note) bits.push("“" + c.note + "”");
    return bits.join(" · ");
  }

  // Claude's account of the job, written to the user: the headline, then why it fits, what they'd
  // enjoy, what to watch out for, the one question, the resume changes and the words to mirror.
  function summaryBlock(j) {
    var s = j.summary;
    if (!s || !s.headline) return "";
    var parts = PARTS.map(function (p) {
      var v = s[p[0]];
      if (!v || (Array.isArray(v) && !v.length)) return "";
      var body = Array.isArray(v) ? "<ul>" + v.map(function (x) { return "<li>" + esc(x) + "</li>"; }).join("") + "</ul>" : "<span>" + esc(v) + "</span>";
      return '<div class="part ' + p[2] + '"><span class="k">' + p[1] + "</span>" + body + "</div>";
    }).join("");
    if (s.mirror && s.mirror.length) {
      parts += '<div class="part tip"><span class="k">Words to mirror</span><div class="chips">' +
        s.mirror.map(function (w) { return '<span class="chip word">' + esc(w) + "</span>"; }).join("") + "</div></div>";
    }
    return '<p class="headline">' + esc(s.headline) + "</p>" + (parts ? '<div class="parts">' + parts + "</div>" : "");
  }

  // Claude's working notes on the verdict (the note it was recorded with, and the posting's line it rests
  // on): kept for checking and tuning, folded away.
  function behind(j) {
    var said = j.claude_said != null ? String(j.claude_said || "") : (j.by === "user" ? "" : String(j.note || ""));
    var bits = [];
    if (said) bits.push("<p>" + esc(said) + "</p>");
    if (j.quote) bits.push("<p>From the posting: “" + esc(j.quote) + "”</p>");
    if (!bits.length) return "";
    return '<details class="behind"><summary>Behind the call</summary><div class="behind-body">' + bits.join("") + "</div></details>";
  }

  // A job judged before summaries: its "Question: ..." note is still the one question, shown plainly
  // (without the rule numbers it may carry) until Claude writes the summary.
  function oldQuestion(j) {
    var said = j.claude_said != null ? String(j.claude_said || "") : (j.by === "user" ? "" : String(j.note || ""));
    var m = said.match(/^Question:\s*([\s\S]*)$/);
    if (!m) return "";
    var q = m[1].replace(/\s*\((?:[^()]*\b)?rules?\s*\d+[^()]*\)/gi, "").trim();
    q = q.charAt(0).toUpperCase() + q.slice(1);
    return q ? '<div class="parts"><div class="part ask"><span class="k">The one question</span><span>' + esc(q) + "</span></div></div>" : "";
  }

  // The user's own words, never mixed up with Claude's.
  function yourWords(j) {
    var yours = j.you_said != null ? String(j.you_said || "") : (j.by === "user" ? String(j.note || "") : "");
    return yours ? '<div class="why said"><span class="k">You said</span>“' + esc(yours) + "”</div>" : "";
  }

  function clockBar(days, closesOn) {
    var total = (data.tracking || {}).presume_after_days || 21;
    if (days == null) return "";
    var pct = Math.max(4, Math.min(100, Math.round(100 * days / total)));
    return '<div class="clock' + (days >= total - 5 ? " late" : "") + '"><div class="clock-bar" role="img" aria-label="Day ' + days + " of " + total + '"><span style="width:' + pct + '%"></span></div>' +
      '<span class="clock-label">Day ' + days + " of " + total + (closesOn ? " · closes " + esc(day(closesOn)) + " if there’s no reply" : "") + "</span></div>";
  }

  // ---------------------------------------------------------------- sections

  // What's waiting for Claude, in a tray that stays closed until the user opens it: each choice already
  // shows on its own job, so a click never sends them up here. Opened from the folder, it holds the copy step.
  function openTray() { var d = document.querySelector("details.tray"); return !!(d && d.open); }

  function yoursSection() {
    var list = pending();
    var bad = problems();
    if (!list.length && !bad.length) return "";
    var rows = list.map(function (c) {
      var detail = chosenDetail(c);
      return '<li class="row choice" data-place="choice:' + esc(c.id) + '"><span class="num">' + (c.num ? "#" + esc(c.num) : "") + "</span>" +
        '<div class="row-main"><span>' + stamp(CHOSEN[c.action] || [c.action, "s-call"]) + " " + esc(c.label) + "</span>" +
        (detail ? '<span class="row-note">' + esc(detail) + "</span>" : "") + "</div>" +
        '<div class="actions"><button type="button" class="mini quiet" data-undo="' + esc(c.id) + '">Undo</button></div></li>';
    }).concat(bad.map(function (c) {
      return '<li class="row choice problem"><span class="num">' + (c.num ? "#" + esc(c.num) : "") + "</span>" +
        '<div class="row-main"><span>' + stamp(CHOSEN[c.action] || [c.action, "s-call"]) + " " + esc(c.label) + "</span>" +
        '<span class="row-note">Claude couldn\'t record this: ' + esc(problemOf(c)) + "</span></div><span></span></li>";
    }));
    var lede = mode === "saving"
      ? "Saved on this page. Claude records " + (list.length === 1 ? "it" : "them") + " in your Job Search folder the next time you talk to it. Changed your mind? Undo, here or on the job."
      : "This copy of the page can't send them to Claude by itself. Press <strong>Copy my choices</strong>, then paste them into Claude.";
    var says = list.length ? (mode === "saving" ? "saved for Claude" : "not sent to Claude yet") : "";
    return '<section id="s-yours" aria-label="Your choices"><details class="tray"' + (openTray() ? " open" : "") + ">" +
      '<summary>Your choices <span class="count">' + list.length + "</span>" + (says ? '<span class="muted">' + says + "</span>" : "") +
      (bad.length ? '<span class="error">' + plural(bad.length, "choice", "choices") + " Claude couldn't record</span>" : "") + "</summary>" +
      '<p class="lede">' + lede + "</p>" + '<ul class="rows">' + rows.join("") + "</ul>" +
      (mode === "file" && list.length ? '<div class="actions"><button type="button" class="primary" data-copy>Copy my choices</button>' +
        '<span class="muted" id="copy-note">Then paste them into Claude.</span></div>' +
        '<textarea id="copy-text" readonly hidden aria-label="Your choices, to copy"></textarea>' : "") +
      "</details></section>";
  }

  // An interview: when, who, and (opened from the folder) its prep sheet and calendar file.
  var ASKER = { recruiter: "recruiter", hiring_manager: "hiring manager", head_of_function: "head of the team",
    executive: "executive", peer: "a peer", panel: "a panel", other: "" };
  function whoLine(e) {
    var who = e["with"] ? "with " + esc(e["with"]) : "";
    var asker = ASKER[e.asker] || "";
    return who && asker ? who + " (" + asker + ")" : who || (asker ? "with " + asker : "");
  }

  function comingCard(e) {
    var when = whenText(e.on);
    var rel = e.past ? "" : e.days === 0 ? "today" : e.days === 1 ? "tomorrow" : "in " + e.days + " days";
    var kind = { phone: "Phone", video: "Video call", onsite: "On site" }[e.kind] || "";
    var local = location.protocol === "file:";
    var links = [];
    if (e.prep) links.push(local ? '<a href="' + esc(e.prep) + '">Prep sheet</a>' : "Prep sheet: " + esc(e.prep));
    if (e.calendar && local) links.push('<a href="' + esc(e.calendar) + '">Add to calendar</a>');
    return '<article class="card soon" data-place="coming:' + esc((e.application || e.num || "") + " " + e.on) + '"><div class="card-top"><span class="num">' + (e.num ? "#" + esc(e.num) : "") + "</span>" +
      stamp([e.stage === "screen" ? "Screen" : "Interview", e.past ? "s-closing" : "s-screen"]) +
      '<span class="pay">' + when + (rel ? " · " + rel : "") + "</span></div>" +
      "<h3>" + esc(e.company) + ", " + esc(e.role) + "</h3>" +
      '<p class="where">' + [kind, whoLine(e), e.minutes && e.on.length > 10 ? e.minutes + " min" : ""].filter(Boolean).join(" · ") + "</p>" +
      (e["for"] ? '<p class="row-note">For: ' + esc(e["for"]) + "</p>" : "") +
      (e.past ? '<p class="flag">How did it go? Tell Claude “how did my ' + esc(e.company) + " " + esc(e.stage || "interview") + " go”.</p>"
        : (e.prep ? "" : '<p class="muted">No prep sheet yet. Say “prep me for my ' + esc(e.company) + " " + esc(e.stage || "interview") + "”.</p>")) +
      (links.length ? '<p class="actions">' + links.join(" · ") + "</p>" : "") + "</article>";
  }

  function todoCard(t) {
    var what = t.route === "send"
      ? "Follow up with " + esc(t.contact) + ". Ask Claude to draft a short note, then send it yourself."
      : t.route === "find_person"
        ? "A top pick with nobody to follow up with. Look for the person who would manage this role, and add their name."
        : "Nothing to send without a contact.";
    return '<article class="card todo" data-place="todo:' + esc(t.id) + '"><div class="card-top"><span class="num">' + (t.num ? "#" + esc(t.num) : "") + "</span>" + stamp(ROUTE[t.route]) + "</div>" +
      "<h3>" + esc(t.company) + ", " + esc(t.role) + "</h3><p>" + what + "</p>" + clockBar(daysSince(t.applied_date, t.days), t.closes_on) + saidLines(t.id) +
      '<div class="actions">' + (t.route === "send"
        ? button("followed_up", "app", t.id, "primary")
        : button("contact", "app", t.id, "primary") + button("followed_up", "app", t.id, "quiet")) + "</div>" +
      (opened("s-todo") ? panel("app", t.id, "followed_up") + panel("app", t.id, "contact") : "") + "</article>";
  }

  // Top picks with nobody to follow up with: one card, each with a search to open and a name to add.
  function peopleCard(list) {
    var rows = list.map(function (t) {
      var q = "https://www.linkedin.com/search/results/people/?keywords=" + encodeURIComponent(t.search || t.company);
      return '<li data-place="todo:' + esc(t.id) + '"><span class="num">' + (t.num ? "#" + esc(t.num) : "") + "</span>" +
        '<div class="row-main"><span class="row-title">' + esc(t.company) + ", " + esc(t.role) + "</span>" +
        '<span class="row-meta">Day ' + esc(daysSince(t.applied_date, t.days)) + " of " + ((data.tracking || {}).presume_after_days || 21) +
        (t.closes_on ? " · closes " + esc(day(t.closes_on)) + " if there’s no reply" : "") + "</span></div>" +
        '<div class="actions"><a class="btn" href="' + esc(q) + '" target="_blank" rel="noopener">Search LinkedIn</a>' +
        button("contact", "app", t.id, "mini primary", "Add their name", t.num) + button("followed_up", "app", t.id, "mini quiet", "", t.num) + "</div>" +
        saidLines(t.id) + (opened("s-todo") ? panel("app", t.id, "followed_up") + panel("app", t.id, "contact") : "") + "</li>";
    });
    return '<article class="card todo"><div class="card-top">' + stamp(ROUTE.find_person) + "</div>" +
      "<h3>" + plural(list.length, "top pick has", "top picks have") + " nobody to follow up with</h3>" +
      "<p>For each, find the person who would manage the role (Search LinkedIn opens a search for you), then add their name. " +
      "Claude can then draft a short note for you to send.</p>" + '<ul class="people">' + rows.join("") + "</ul></article>";
  }

  // A job with a choice waiting for Claude stays where it is: its buttons give way to the choice, with an
  // Undo, so a click lands where it was made and there's nothing left to press twice.
  function jobCard(j) {
    var wanted = j.status === "worth_applying" && j.by === "user";
    var verdict = wanted ? ["You want it", "s-worth"] : (VERDICT[j.status] || ["", ""]);
    var t = cleanTitle(j);
    var acts = wanted ? [["applied", "primary"], ["skip", "quiet"]] : [["want", "primary"], ["skip", "quiet"], ["applied", "quiet"]];
    var summary = summaryBlock(j);
    var chosen = waitingOn("key", j.key);
    return '<article class="card' + (chosen ? " chosen" : "") + '" id="job-' + esc(j.key) + '" data-place="job:' + esc(j.key) + '">' +
      '<div class="card-top"><span class="num">#' + esc(j.num) + "</span>" + stamp(verdict) +
      (j.salary ? '<span class="pay">' + esc(j.salary) + "</span>" : "") + "</div>" +
      "<h3>" + (href(j.url) ? '<a href="' + href(j.url) + '" target="_blank" rel="noopener">' + esc(t.title) + "</a>" : esc(t.title)) + "</h3>" +
      '<p class="where"><b>' + esc(j.company) + "</b> · " + esc(t.place || "place not stated") + (j.salary ? "" : " · pay not stated") + "</p>" +
      (summary || (oldQuestion(j) + (j.by !== "user" ? '<p class="muted">Claude writes this one up for you the next time you go through your jobs.</p>' : ""))) +
      yourWords(j) +
      (j.flag ? '<p class="flag">' + esc(j.flag) + "</p>" : "") +
      (j.gone ? '<p class="flag">No longer on the company\'s job board since ' + day(j.gone) + ".</p>" : "") +
      behind(j) +
      (chosen ? saidLine(chosen)
        : '<div class="actions">' + acts.map(function (a) { return button(a[0], "job", j.key, a[1]); }).join("") + "</div>" +
          acts.map(function (a) { return panel("job", j.key, a[0]); }).join("")) +
      "</article>";
  }

  function jobRow(j, kind) {
    var t = cleanTitle(j);
    var acts = kind === "screened" ? [["want", "Want it anyway"]] : [["want", "Want it"], ["skip", "Skip"]];
    var search = (t.title + " " + j.company + " " + t.place).toLowerCase();
    var chosen = waitingOn("key", j.key);
    return '<li class="row' + (chosen ? " chosen" : "") + '" data-search="' + esc(search) + '" data-place="job:' + esc(j.key) + '"><span class="num">#' + esc(j.num) + "</span>" +
      '<div class="row-main">' +
      (href(j.url) ? '<a class="row-title" href="' + href(j.url) + '" target="_blank" rel="noopener">' + esc(t.title) + "</a>" : '<span class="row-title">' + esc(t.title) + "</span>") +
      '<span class="row-meta">' + esc(j.company) + " · " + esc(t.place || "place not stated") +
      (j.salary ? ' · <span class="pay">' + esc(j.salary) + "</span>" : "") + "</span>" +
      (j.hold_until ? '<span class="row-note">On hold until ' + day(j.hold_until) + ": you applied to " + esc(j.company) + " recently.</span>" : "") +
      (j.summary && j.summary.headline ? '<span class="row-note">' + esc(j.summary.headline) + "</span>"
        : (j.claude_said != null ? j.claude_said : j.note) ? '<span class="row-note">' + esc(plainReason(j.claude_said != null ? j.claude_said : j.note)) + "</span>" : "") +
      (j.you_said ? '<span class="row-note">You said: \u201c' + esc(j.you_said) + "\u201d</span>" : "") +
      (j.flag ? '<span class="row-note flag">' + esc(j.flag) + "</span>" : "") +
      (j.gone ? '<span class="row-note flag">No longer on the company\'s job board since ' + day(j.gone) + ".</span>" : "") +
      "</div>" +
      (chosen ? '<div class="actions">' + stamp(CHOSEN[chosen.action] || [chosen.action, "s-call"]) +
          '<button type="button" class="mini quiet" data-undo="' + esc(chosen.id) + '" aria-label="Undo, #' + esc(j.num) + '">Undo</button></div>'
        : '<div class="actions">' + acts.map(function (a) { return button(a[0], "job", j.key, "mini", a[1], j.num); }).join("") + "</div>" +
          acts.map(function (a) { return panel("job", j.key, a[0]); }).join("")) +
      "</li>";
  }

  // A choice waiting for Claude, on the job or application it was made on: what, when, and an Undo.
  function saidLine(c) {
    var detail = chosenDetail(c);
    return '<p class="said-line">You said: ' + stamp(CHOSEN[c.action] || [c.action, "s-call"]) +
      (detail ? " " + esc(detail) : "") + ' <span class="muted">' + (mode === "saving" ? "Saved for Claude, " : "Not sent to Claude yet, ") +
      stampText(c.at) + ".</span> " + '<button type="button" class="link" data-undo="' + esc(c.id) + '">Undo</button></p>';
  }

  function saidLines(id) {
    return pending().filter(function (c) { return c.app === id; }).map(saidLine).join("");
  }

  function appRow(a) {
    var st = STATUS[a.status] || [a.status, "s-closed"];
    var how = [VIA[a.channel], a.top_pick === true ? "a top pick" : ""].filter(Boolean).join(", ");
    var meta = ["Applied " + day(a.applied_date) + (a.estimated ? " (about)" : ""), esc(how),
      a.contact ? "contact " + esc(a.contact) : "", a.followed_up ? "followed up " + day(a.followed_up) : "",
      a.status !== "applied" && a.last && a.last.date ? "last news " + day(a.last.date) : ""].filter(Boolean).join(" · ");
    var live = ["applied", "replied", "screen", "interview", "offer", "presumed_rejected"].indexOf(a.status) >= 0;
    var mine = opened("s-apps") && open.kind === "app" && open.ref === a.id;
    var menu = mine && open.action === "menu"
      ? '<div class="panel"><span class="muted">What happened?</span><div class="choices-menu">' + APP_CHOICES.map(function (o) {
          return button(o, "app", a.id, "mini");
        }).join("") + '<button type="button" class="mini quiet" data-cancel>Cancel</button></div></div>' : "";
    return '<li class="app" data-search="' + esc((a.company + " " + a.role).toLowerCase()) + '" data-place="app:' + esc(a.id) + '"><span class="num">' + (a.num ? "#" + esc(a.num) : "") + "</span>" +
      '<div class="app-main"><span class="app-name"><b>' + esc(a.company) + "</b>, " +
      (href(a.url) ? '<a href="' + href(a.url) + '" target="_blank" rel="noopener">' + esc(a.role) + "</a>" : esc(a.role)) + "</span>" +
      '<span class="app-meta">' + meta + "</span>" +
      (a.gone && live ? '<span class="row-note flag">Posting pulled on ' + day(a.gone) + ". " +
        (location.protocol === "file:" && a.saved_copy ? '<a href="' + esc(a.saved_copy) + '">Your saved copy</a> is in your folder. '
          : "Your saved copy is in your folder; ask Claude for it. ") +
        "Companies often take a posting down once they have enough people in process; on its own it doesn't end yours.</span>" : "") +
      (a.status === "applied" ? clockBar(daysSince(a.applied_date, a.days), a.closes_on) : "") + "</div>" +
      '<div class="app-side">' + stamp(st) + (live && !mine ? button("menu", "app", a.id, "mini", "Update", a.num) : "") + "</div>" +
      '<div class="more">' + saidLines(a.id) + menu + (mine && open.action !== "menu" ? panel("app", a.id, open.action) : "") + "</div></li>";
  }

  function head(id, title, n, lede) {
    return '<div class="section-head"><h2 id="h-' + id + '">' + title + ' <span class="count">' + n + "</span></h2>" +
      (lede ? '<p class="lede">' + lede + "</p>" : "") + "</div>";
  }

  // ---------------------------------------------------------------- the page

  // The page redraws whole whenever anything changes. What the user is looking at stays where it is on
  // the screen: the job or row they last clicked, if it's in view, otherwise the first thing in view.
  var placeKey = "";
  function findPlace(key) {
    var all = document.querySelectorAll("[data-place]");
    for (var i = 0; i < all.length; i++) if (all[i].getAttribute("data-place") === key) return all[i];
    return null;
  }
  function notePlace() {
    var top = Math.max(0, document.getElementById("jump").getBoundingClientRect().bottom || 0);  // under the sticky bar
    var el = placeKey ? findPlace(placeKey) : null;
    var r = el && el.getBoundingClientRect();
    if (!r || !r.height || r.bottom <= top || r.top >= window.innerHeight) {
      el = null;
      var all = document.querySelectorAll("[data-place]");
      for (var i = 0; i < all.length && !el; i++) {
        var q = all[i].getBoundingClientRect();
        if (q.height && q.bottom > top) { el = all[i]; r = q; }
      }
    }
    return el ? { key: el.getAttribute("data-place"), top: r.top } : null;
  }
  function keepPlace(p) {
    var el = p && findPlace(p.key);
    if (el) window.scrollBy(0, el.getBoundingClientRect().top - p.top);
  }

  function render() {
    var app = document.getElementById("app");
    var status = document.getElementById("status");
    var jump = document.getElementById("jump");
    var place = notePlace();
    if (!data) {
      document.getElementById("updated").textContent = "";
      app.innerHTML = yoursSection() + '<p class="empty">Your jobs appear here after Claude next checks your job boards. Ask Claude “show me my jobs page” to fill it in.</p>';
      renderSendbar();
      return;
    }
    document.getElementById("title").textContent = data.title || "Your job search";
    var asOf = new Date(data.as_of);
    document.getElementById("updated").textContent = "Updated " + day(data.as_of) +
      (isNaN(asOf) ? "" : ", " + asOf.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" }));
    status.innerHTML = (data.review_ready ? '<span class="chip review">Your weekly review is ready</span><span>Say “go through my review” to Claude.</span>' : "") +
      (scanFailed() ? '<span class="chip warn">The last check failed</span><span>It couldn’t reach your job boards, so nothing was checked' +
        (data.last_scan.good_at ? "; the last one that did was " + stampText(data.last_scan.good_at) : "") + ".</span>" : "") +
      (mode === "file" ? '<span class="chip local">Opened from your folder</span><span>Clicks here stay in this browser until you copy them to Claude.</span>' : "") +
      (problem ? '<span class="error">' + esc(problem) + "</span>" : "");

    // A job with a choice waiting for Claude stays in its place, showing the choice (jobCard, jobRow).
    var waiting = data.waiting;
    var look = waiting.filter(function (j) { return j.status !== "new"; });
    var fresh = waiting.filter(function (j) { return j.status === "new"; });
    var screened = data.screened;
    var held = data.on_hold || [];
    var todo = data.todo;
    var apps = data.applications;
    var openApps = apps.filter(function (a) { return ["applied", "replied", "screen", "interview", "offer"].indexOf(a.status) >= 0; }).length;
    var mineCount = pending().length;

    var coming = data.coming_up || [];
    var expected = data.expected || [];
    var parts = [["yours", "Your choices", mineCount], ["coming", "Coming up", coming.length], ["todo", "To do", todo.length], ["look", "Worth a look", look.length],
                 ["hold", "On hold", held.length], ["apps", "Applications", apps.length], ["new", "New", fresh.length + (data.more_waiting || 0)], ["out", "Screened out", Math.max(screened.length, data.screened_total || 0)]];
    jump.hidden = false;
    jump.innerHTML = parts.filter(function (p) { return (p[0] !== "yours" && p[0] !== "coming") || p[2]; }).map(function (p) {
      var hot = (p[0] === "yours" || p[0] === "coming" || p[0] === "todo" || p[0] === "look") && p[2];
      if (p[0] === "hold" && !p[2]) return "";
      return '<button type="button" data-jump="' + p[0] + '" class="' + (hot ? "hot" : p[2] ? "" : "zero") + '">' + esc(p[1]) + " <b>" + p[2] + "</b></button>";
    }).join("");

    var html = [yoursSection(), focusSection()];
    if (coming.length || expected.length) {
      html.push('<section id="s-coming" aria-labelledby="h-coming">' + head("coming", "Coming up", coming.length,
        coming.length ? "Your interviews, soonest first. Say “prep me for my " + esc(coming[0].company) + " " + esc(coming[0].stage || "interview") +
        "” to Claude for a prep sheet, or “how did it go” afterwards." : "") +
        '<div class="stack">' + coming.map(comingCard).join("") + "</div>" +
        (expected.length ? '<p class="lede">Still to come, no day yet:</p><ul class="rows">' + expected.map(function (x) {
          return '<li class="row"><div class="row-main"><span class="row-title">' + esc(x.company) + ": " + esc(x["for"]) + "</span>" +
            '<span class="row-meta">' + [whoLine(x), "noted " + day(x.noted)].filter(Boolean).join(" · ") + "</span></div></li>";
        }).join("") + "</ul>" : "") + "</section>");
    }
    html.push('<section id="s-todo" aria-labelledby="h-todo">' + head("todo", "To do", todo.length,
      todo.length ? "Follow-ups that are due. With no reply after " + ((data.tracking || {}).presume_after_days || 21) + " days, an application closes as no reply; a reply after that still counts." : "") +
      (todo.length ? '<div class="stack">' + todo.filter(function (t) { return t.route !== "find_person"; }).map(todoCard).join("") +
        (todo.some(function (t) { return t.route === "find_person"; }) ? peopleCard(todo.filter(function (t) { return t.route === "find_person"; })) : "") +
        "</div>" : '<p class="empty">Nothing due.</p>') + "</section>");
    html.push('<section id="s-look" aria-labelledby="h-look">' + head("look", "Worth a look", look.length,
      look.length ? "The jobs Claude thinks are worth applying to, the ones that need your call, and the ones you want." : "") +
      (look.length ? '<div class="stack">' + look.map(jobCard).join("") + "</div>"
        : '<p class="empty">Nothing here yet. Ask Claude to go through the new ones.</p>') + "</section>");
    if (held.length) {
      html.push('<section id="s-hold" aria-labelledby="h-hold">' + head("hold", "On hold", held.length,
        "Good fits at companies you applied to in the last " + ((data.tracking || {}).cooldown_days || 30) + " days. Each comes back to you on its date. " +
        "Asking someone there about a referral first is the better way in.") +
        '<ul class="rows">' + held.map(function (j) { return jobRow(j, "hold"); }).join("") + "</ul></section>");
    }
    html.push('<section id="s-apps" aria-labelledby="h-apps">' + head("apps", "Applications", apps.length,
      apps.length ? openApps + " open of " + apps.length + ". Press Update when you hear back." : "") +
      (apps.length ? appsControls(apps.length, openApps) + appsList(apps)
        : '<p class="empty">No applications yet. When you apply, tell Claude or press I applied on the job.</p>') + "</section>");
    html.push('<section id="s-new" aria-labelledby="h-new">' + head("new", "New", fresh.length,
      fresh.length ? "Claude hasn’t gone through these yet. Say “go through the new ones” and they’ll be sorted, or mark any here." : "") +
      (fresh.length ? '<div class="filter"><input type="search" id="filter-new" placeholder="Filter by title, company or place" value="' + esc(filter) + '" aria-label="Filter the new jobs">' +
        '<span class="count" id="filter-count"></span></div><ul class="rows" id="new-rows">' + fresh.map(function (j) { return jobRow(j, "new"); }).join("") + "</ul>"
        : '<p class="empty">' + nothingNew() + "</p>") +
      (data.more_waiting ? '<p class="lede">And ' + data.more_waiting + " older ones not gone through yet, left off this page to keep it quick.</p>" : "") +
      "</section>");
    if (screened.length) {
      var outTotal = Math.max(screened.length, data.screened_total || 0);
      html.push('<section id="s-out" aria-labelledby="h-out"><details class="out"' + (openOut() ? " open" : "") + '><summary id="h-out">Screened out <span class="count">' + outTotal + "</span></summary>" +
        '<p class="lede">' + (outTotal > screened.length ? "The latest " + screened.length + " of the " + outTotal + " from the last two weeks" : "The last two weeks") +
        ", each with its reason. Press Want it anyway on any you disagree with; your weekly review looks at these.</p>" +
        '<ul class="rows">' + screened.map(function (j) { return jobRow(j, "screened"); }).join("") + "</ul></details></section>");
    }

    // Keep focus and the caret where they were (the page redraws when a choice saves or new data arrives).
    var focused = document.activeElement && document.activeElement.id;
    var caret = focused && document.activeElement.selectionStart;
    app.innerHTML = html.join("");
    keepPlace(place);
    if (focused && document.getElementById(focused)) {
      var el = document.getElementById(focused);
      el.focus({ preventScroll: true });
      try { if (caret != null) el.setSelectionRange(caret, caret); } catch (e) { /* not a text field */ }
    }
    applyFilter();
    applyAppsFilter();
    renderSendbar();
  }

  // ---------------------------------------------------------------- today

  function actionLine(a) {
    var n = a.num ? "#" + esc(a.num) + " " : "";
    var stage = esc(a.stage || "interview");
    if (a.kind === "time") return "Find out the time of your " + esc(a.company) + " " + stage + " on " + dayOf(a.on) + ", and tell Claude.";
    if (a.kind === "prep") return "Prep for your " + esc(a.company) + " " + stage + " (" + whenText(a.on) + "): say “prep me for my " + esc(a.company) + " " + stage + "”.";
    if (a.kind === "debrief") return "Tell Claude how your " + esc(a.company) + " " + stage + " went, while it’s fresh.";
    if (a.kind === "follow_up") return "Follow up with " + esc(a.contact) + " at " + n + esc(a.company) + ". Claude can draft a short note.";
    if (a.kind === "find_person") return plural(a.count, "top pick has", "top picks have") + " nobody to follow up with. " +
      '<button type="button" class="link" data-jump="todo">Find them a contact</button>';
    if (a.kind === "apply") return "Apply to " + n + esc(a.company) + ", " + esc(cleanTitle(a).title) + ".";
    return "";
  }

  function focusSection() {
    var f = data.focus;
    if (!f) return "";
    var blocks = [];
    var e = f.next_interview;
    if (e) {
      blocks.push('<div class="focus-block"><span class="k">Next interview</span><p><b>' + esc(e.company) + "</b>, " + esc(e.role) +
        '<span class="sub">' + whenText(e.on) + (whoLine(e) ? " · " + whoLine(e) : "") + (e["for"] ? " · " + esc(e["for"]) : "") + " · " +
        (e.prep ? "prep sheet ready" : "no prep sheet yet") + "</span></p></div>");
    }
    if (f.actions && f.actions.length) {
      blocks.push('<div class="focus-block"><span class="k">To do now</span><ul class="focus-list">' +
        f.actions.map(function (a) { return "<li>" + actionLine(a) + "</li>"; }).join("") + "</ul>" +
        (f.more_actions ? '<p class="muted">And ' + plural(f.more_actions, "more thing", "more things") + " below.</p>" : "") + "</div>");
    }
    if (f.top_picks && f.top_picks.length) {
      blocks.push('<div class="focus-block"><span class="k">Your top picks</span><ul class="focus-list">' + f.top_picks.map(function (p) {
        return '<li><button type="button" class="link" data-jump-card="' + esc(p.key) + '">#' + esc(p.num) + " " + esc(p.company) + ", " +
          esc(cleanTitle(p).title) + "</button>" + (p.headline ? '<span class="sub">' + esc(p.headline) + "</span>" : "") + "</li>";
      }).join("") + "</ul>" + (f.more_picks ? '<p class="muted">And ' + f.more_picks + ' more under <button type="button" class="link" data-jump="look">Worth a look</button>.</p>' : "") + "</div>");
    }
    var kp = kpis();
    if (!blocks.length && !kp) return "";
    return '<section class="focus" id="s-today" aria-labelledby="h-today" data-place="today"><h2 id="h-today">Today</h2>' +
      (blocks.length ? '<div class="focus-grid">' + blocks.join("") + "</div>" : '<p class="muted">Nothing needs you right now.</p>') + kp + "</section>";
  }

  // How the search is going, in facts: a row of numbers, and applications sent each week.
  function kpis() {
    var f = data.funnel;
    if (!f) return "";
    var tiles = [["Jobs saved", f.saved], ["Applied", f.applied], ["Got a screen", f.screens], ["Got an interview", f.interviews], ["Offers", f.offers]];
    var html = tiles.map(function (t) {
      return '<div class="tile"><span class="label">' + t[0] + '</span><span class="value">' + esc(t[1]) + "</span></div>";
    });
    var weeks = data.activity || [];
    if (weeks.length) {
      var max = Math.max.apply(null, weeks.map(function (w) { return w.applied; })) || 1;
      var last = weeks.length - 1;
      var bars = weeks.map(function (w, i) {
        var label = "Week of " + day(w.week) + ": " + plural(w.applied, "application", "applications");
        return "<span" + (i === last ? ' class="now"' : "") + ' style="height:' + Math.round(100 * w.applied / max) + '%" title="' + label + '"></span>';
      }).join("");
      html.push('<div class="tile wide"><span class="label">Applied each week</span><span class="value">' + esc(weeks[last].applied) +
        " <small>this week</small></span>" + '<div class="spark" role="img" aria-label="Applications each week, the last ' + weeks.length + ": " +
        weeks.map(function (w) { return day(w.week) + " " + w.applied; }).join(", ") + '">' + bars + "</div></div>");
    }
    return '<div class="kpis">' + html.join("") + "</div>";
  }

  function nothingNew() {
    var ls = data.last_scan || {};
    if (scanFailed()) {
      return "Nothing new: the last check, " + stampText(ls.attempt_at) + ", couldn’t reach your job boards." +
        (ls.good_at ? " The last one that did was " + stampText(ls.good_at) + "." : "");
    }
    return ls.good_at ? "Nothing new since the last check, " + stampText(ls.good_at) + "." : "Nothing new. New jobs appear here after each check.";
  }

  // ---------------------------------------------------------------- applications: which, and in what order

  function appsControls(all, openN) {
    return '<div class="controls" data-place="apps-controls"><div class="seg" role="group" aria-label="Which applications">' +
      '<button type="button" data-apps-view="open" aria-pressed="' + (appsView !== "all") + '">Open <b>' + openN + "</b></button>" +
      '<button type="button" data-apps-view="all" aria-pressed="' + (appsView === "all") + '">All <b>' + all + "</b></button></div>" +
      '<input type="search" id="filter-apps" placeholder="Filter by company or role" value="' + esc(appsFind) + '" aria-label="Filter your applications">' +
      '<label>Sort <select id="sort-apps">' + [["recent", "Newest first"], ["days", "Longest waiting"], ["stage", "Furthest along"], ["company", "Company"]].map(function (o) {
        return '<option value="' + o[0] + '"' + (appsSort === o[0] ? " selected" : "") + ">" + o[1] + "</option>";
      }).join("") + "</select></label></div>";
  }

  function appsList(apps) {
    var list = apps.filter(function (a) { return appsView === "all" || OPEN_STATUSES.indexOf(a.status) >= 0 || (open && open.ref === a.id); });
    if (appsSort === "days") list.sort(function (x, y) { return (daysSince(y.applied_date, y.days) || 0) - (daysSince(x.applied_date, x.days) || 0); });
    else if (appsSort === "stage") list.sort(function (x, y) { return (FURTHEST[x.status] == null ? 9 : FURTHEST[x.status]) - (FURTHEST[y.status] == null ? 9 : FURTHEST[y.status]); });
    else if (appsSort === "company") list.sort(function (x, y) { return String(x.company).localeCompare(String(y.company)); });
    if (!list.length) return '<p class="empty">No open applications. Choose All to see the rest.</p>';
    return '<ul class="apps" id="app-rows">' + list.map(appRow).join("") + "</ul>" + '<p class="muted" id="apps-count" hidden></p>';
  }

  function applyAppsFilter() {
    var list = document.getElementById("app-rows");
    if (!list) return;
    var words = appsFind.toLowerCase().split(/\s+/).filter(Boolean);
    var rows = list.querySelectorAll("li.app");
    var shown = 0;
    Array.prototype.forEach.call(rows, function (r) {
      var hit = words.every(function (w) { return r.getAttribute("data-search").indexOf(w) >= 0; });
      r.hidden = !hit;
      shown += hit ? 1 : 0;
    });
    var c = document.getElementById("apps-count");
    if (c) { c.hidden = !words.length; c.textContent = "Showing " + shown + " of " + rows.length + "."; }
  }

  function openOut() {
    var d = document.querySelector("details.out");
    return (d && d.open) || (open && open.kind === "job" && data.screened.some(function (j) { return j.key === open.ref; }));
  }

  function applyFilter() {
    var list = document.getElementById("new-rows");
    if (!list) return;
    var words = filter.toLowerCase().split(/\s+/).filter(Boolean);
    var rows = list.querySelectorAll(".row");
    var shown = 0;
    Array.prototype.forEach.call(rows, function (r) {
      var hit = words.every(function (w) { return r.getAttribute("data-search").indexOf(w) >= 0; });
      r.hidden = !hit;
      shown += hit ? 1 : 0;
    });
    var c = document.getElementById("filter-count");
    if (c) c.textContent = words.length ? "Showing " + shown + " of " + rows.length : "";
  }

  // Opened from the folder, a bar at the bottom keeps the one step that sends choices in reach.
  function renderSendbar() {
    var bar = document.getElementById("sendbar");
    var n = pending().length;
    bar.hidden = mode !== "file" || !n;
    if (bar.hidden) return;
    bar.innerHTML = "<span><strong>" + n + "</strong> choice" + (n === 1 ? "" : "s") + " not sent to Claude yet.</span>" +
      '<button type="button" data-copy>Copy my choices</button>';
  }

  function choiceText(list) {
    var lines = ["My job choices:"];
    list.forEach(function (c) {
      var detail = chosenDetail(c);
      lines.push("- " + (c.num ? "#" + c.num + " " : "") + c.label + ": " + ACTIONS[c.action] + (detail ? " (" + detail + ")" : ""));
    });
    lines.push("[choices: " + JSON.stringify(list) + "]");
    return lines.join("\n");
  }

  // ---------------------------------------------------------------- saving

  function labelFor(kind, ref) {
    var list = kind === "job" ? data.waiting.concat(data.on_hold || [], data.screened) : data.applications;
    var x = list.filter(function (i) { return (kind === "job" ? i.key : i.id) === ref; })[0] || {};
    var title = kind === "job" ? cleanTitle(x).title : x.role;
    return { num: x.num || null, label: (x.company || "") + ", " + (title || "") };
  }

  function saveLocal() {
    try { localStorage.setItem(LOCAL, JSON.stringify(choices)); } catch (e) { /* a private window: kept until the page closes */ }
  }

  function loadLocal() {
    // Every copy of this page saved under its own name before 0.6.0; gather those too, so clicks a
    // rebuilt page hid are found again. Then forget the ones Claude has dealt with.
    choices = {};
    var old = [];
    try {
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k && k.indexOf(PREFIX) === 0) {
          var saved = JSON.parse(localStorage.getItem(k) || "{}") || {};
          Object.keys(saved).forEach(function (id) { if (!choices[id]) choices[id] = saved[id]; });
          if (k !== LOCAL) old.push(k);
        }
      }
    } catch (e) { choices = choices || {}; }
    Object.keys(choices).forEach(function (id) {
      var h = handledAs(choices[id]);
      if (h && h !== "unknown") delete choices[id];
    });
    saveLocal();
    try { old.forEach(function (k) { localStorage.removeItem(k); }); } catch (e) { /* kept: harmless */ }
  }

  function remove(id) {
    delete choices[id];
    if (mode === "saving") clicks.doc(id).delete().catch(function () { problem = "Couldn't undo that one. Tell Claude in chat instead."; render(); });
  }

  function save() {
    var l = labelFor(open.kind, open.ref);
    var field = open.kind === "job" ? "key" : "app";
    var c = { id: newId(), at: new Date().toISOString(), action: open.action, num: l.num, label: l.label,
              note: (draft.note || "").trim(), channel: draft.channel || "", top_pick: draft.top_pick || "",
              contact: (draft.contact || "").trim(), recorded: "" };
    c[field] = open.ref;
    if (c.action === "contact" && !c.contact) { problem = "Add the person's name before saving."; render(); return; }
    // A new choice on the same job replaces the one still waiting for Claude: only the last word counts.
    if (!EVENTS[c.action]) {
      pending().forEach(function (old) { if (old[field] === c[field] && !EVENTS[old.action]) remove(old.id); });
    }
    choices[c.id] = c;
    open = null; draft = {}; problem = "";
    if (mode === "saving") {
      clicks.doc(c.id).set(c).catch(function (e) {
        problem = "That choice didn't save" + (e && e.code === "quota_exceeded" ? ": this page's storage is full." : ". Try again, or tell Claude in chat.");
        delete choices[c.id]; render();
      });
      toast("Saved: " + (CHOSEN[c.action] || [c.action])[0] + (c.num ? ", #" + c.num : "") + " " + c.label +
            ". Claude records it the next time you talk.");
    } else {
      saveLocal();
      toast("Noted: " + (CHOSEN[c.action] || [c.action])[0] + (c.num ? ", #" + c.num : "") + ". Use Copy my choices to send it to Claude.");
    }
    render();  // the job stays where it is, now showing the choice; nothing scrolls
    var where = placeKey && findPlace(placeKey);
    var again = where && where.querySelector('[data-undo="' + c.id + '"]');
    if (again) again.focus({ preventScroll: true });
  }

  function undo(id) {
    var c = choices[id];
    if (!c || c.recorded) return;
    remove(id);
    if (mode !== "saving") saveLocal();
    toast("Undone: " + (c.num ? "#" + c.num + " " : "") + c.label + ".");
    render();
    var where = placeKey && findPlace(placeKey);
    var first = where && where.querySelector("[data-open]");
    if (first) first.focus({ preventScroll: true });
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("button");
    if (!t) return;
    var holder = t.closest("[data-place]");
    if (holder) placeKey = holder.getAttribute("data-place");
    if (t.hasAttribute("data-apps-view")) {
      appsView = t.getAttribute("data-apps-view");
      try { localStorage.setItem(APPS_VIEW, appsView); } catch (err) { /* for now only */ }
      render();
    } else if (t.hasAttribute("data-jump-card")) {
      var card = document.getElementById("job-" + t.getAttribute("data-jump-card"));
      if (card) card.scrollIntoView({ block: "start", behavior: "smooth" });
    } else if (t.hasAttribute("data-jump")) {
      var target = document.getElementById("s-" + t.getAttribute("data-jump"));
      if (target) {
        var fold = target.querySelector("details.out, details.tray");
        if (fold) fold.open = true;
        target.scrollIntoView({ block: "start", behavior: "smooth" });
      }
    } else if (t.hasAttribute("data-open")) {
      var from = t.closest("section");
      open = { kind: t.getAttribute("data-kind"), ref: t.getAttribute("data-ref"), action: t.getAttribute("data-open"),
               from: from ? from.id : "" };
      draft = {}; problem = ""; render();
      var first = document.querySelector(".panel select, .panel input, .panel .choices-menu button"); if (first) first.focus();
    } else if (t.hasAttribute("data-save")) {
      save();
    } else if (t.hasAttribute("data-cancel")) {
      open = null; draft = {}; render();
    } else if (t.hasAttribute("data-undo")) {
      undo(t.getAttribute("data-undo"));
    } else if (t.hasAttribute("data-copy")) {
      var text = choiceText(pending());
      var area = document.getElementById("copy-text");
      var note = document.getElementById("copy-note");
      var done = function () { if (note) note.textContent = "Copied. Now paste them into Claude."; toast("Copied. Now paste them into Claude."); };
      var fallback = function () {
        if (!area) return;
        var tray = document.querySelector("details.tray");
        if (tray) tray.open = true;
        area.hidden = false; area.value = text; area.focus(); area.select();
        if (note) note.textContent = "Select all of this text, copy it, and paste it into Claude.";
        area.scrollIntoView({ block: "center" });
      };
      try { navigator.clipboard.writeText(text).then(done, fallback); } catch (err) { fallback(); }
    }
  });
  document.addEventListener("input", function (e) {
    if (e.target.id === "filter-new") {
      filter = e.target.value;
      try { localStorage.setItem(FILTER, filter); } catch (err) { /* remembered only for now */ }
      applyFilter();
      return;
    }
    if (e.target.id === "filter-apps") {
      appsFind = e.target.value;
      applyAppsFilter();
      return;
    }
    var f = e.target.getAttribute && e.target.getAttribute("data-field");
    if (f) draft[f] = e.target.value;
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "sort-apps") {
      placeKey = "apps-controls";  // the list reorders under the controls; they stay put
      appsSort = e.target.value;
      try { localStorage.setItem(APPS_SORT, appsSort); } catch (err) { /* for now only */ }
      render();
      return;
    }
    var f = e.target.getAttribute("data-field");
    if (f) draft[f] = e.target.value;
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && open) { open = null; draft = {}; render(); }
  });

  // ---------------------------------------------------------------- connecting to the page's storage

  function newer(a, b) { return !b || Date.parse(a.as_of || 0) > Date.parse(b.as_of || 0); }

  function connect() {
    var c = window.claude;
    if (!c || typeof c.use !== "function") { loadLocal(); render(); return; }
    Promise.all([c.use("db"), c.use("user")]).then(function (got) {
      var db = got[0], user = got[1];
      if (!db || !user) { loadLocal(); render(); return null; }
      return user.id().then(function (uid) {
        if (!uid) { loadLocal(); render(); return; }
        var pageDoc = db.doc("data/users/" + uid + "/page");
        clicks = pageDoc.collection("clicks");
        mode = "saving";
        pageDoc.onSnapshot(function (snap) {
          var d = snap.exists ? snap.data() : null;
          if (d && d.waiting && newer(d, data)) { data = d; render(); }
        }, function () {});
        clicks.onSnapshot(function (qs) {
          var next = {};
          qs.docs.forEach(function (doc) { var v = doc.data(); next[doc.id] = Object.assign({}, v, { id: doc.id }); });
          choices = next; render();
        }, function () { mode = "file"; loadLocal(); render(); });
        render();
      });
    }).catch(function () { loadLocal(); render(); });
  }

  render();
  connect();
})();
</script>
