name: tests

# The engine's tests, on the oldest Python Cowork's workspace has (3.10) and a current one, on the
# two systems people run the kit from. Standard library only: nothing to install.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # Windows Python has no time zone database of its own (Linux, which Cowork's workspace runs,
      # does), so the tests that check a user's time zone need this there. The engine itself still
      # uses the standard library only.
      - name: Time zone data on Windows
        if: runner.os == 'Windows'
        run: python -m pip install tzdata
      - name: Tests
        run: python -B -m unittest discover -s tests -t .
