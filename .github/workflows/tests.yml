name: tests

# The engine's tests, on the oldest Python Cowork's workspace has (3.10) and a current one, on the
# two systems people run the kit from. Standard library only: nothing to install.
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Tests
        run: python -B -m unittest discover -s tests -t .
